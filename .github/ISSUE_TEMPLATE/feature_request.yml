name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请说明**要解决什么问题**，而不只是"希望加某个功能"——这样更容易判断实现方式。

  - type: dropdown
    id: platform
    attributes:
      label: 涉及的使用方式
      options:
        - 油猴脚本（Tampermonkey）
        - 书签脚本
        - 安卓 APK
        - 全部 / 不限
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景 / 问题
      description: 当前是什么情况，哪里不方便
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作（可以是粗略想法）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 参考链接、截图、其他工具的类似做法等
    validations:
      required: false
